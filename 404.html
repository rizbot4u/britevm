<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — BriteVM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black:  #0A0A0F;
    --panel:  #14141F;
    --border: #1E1E2E;
    --brite:  #00E5FF;
    --white:  #F0F0F8;
    --muted:  #8888AA;
    --font-display: 'Instrument Serif', Georgia, serif;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
  }
  .content { position: relative; z-index: 1; max-width: 480px; }
  .code {
    font-family: var(--font-mono);
    font-size: clamp(5rem, 18vw, 9rem);
    color: transparent;
    -webkit-text-stroke: 1px rgba(0,229,255,0.3);
    line-height: 1;
    margin-bottom: 1rem;
    letter-spacing: -0.02em;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-style: italic;
    color: var(--white);
    margin-bottom: 1rem;
  }
  p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.7;
    margin-bottom: 2.5rem;
  }
  .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--brite);
    color: var(--black);
    padding: 0.8rem 1.8rem;
    border-radius: 8px;
    font-weight: 700;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost {
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.8rem 1.8rem;
    border-radius: 8px;
    font-size: 0.85rem;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-ghost:hover { border-color: var(--brite); color: var(--white); }
  .brand {
    position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 0.95rem;
    color: var(--brite);
    text-decoration: none;
    letter-spacing: 0.08em;
  }
  .brand span { color: var(--muted); }
</style>
</head>
<body>
  <div class="grid"></div>
  <a class="brand" href="/">Brite<span>VM</span></a>
  <div class="content">
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>The address you followed may be broken, or the page may have moved. Head back home and keep moving.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Back to Home</a>
      <a href="https://t.me/Novaglobalkeysbot" target="_blank" class="btn-ghost">Open Telegram Bot</a>
    </div>
  </div>
</body>
</html>
